<div class="carousel-section">
  <div class="container-fluid">
    <div class="row">

      <!-- Carousel Column -->
      <div class="col-md-9 carousel-col p-0">

        <div class="hero-region" [style.background-image]="
            news.carousel[activeSlideIndex]?.image
              ? 'url(' + news.carousel[activeSlideIndex].image + ')'
              : 'none'
          ">

          <div class="row m-0 h-100">

            <div class="col-md-3 p-0 vertical-tabs-container">
              <div class="vertical-tabs">
                @for (item of news.carousel; track item.title; let i = $index) {
                <button class="tab-item" [class.active]="activeSlideIndex === i" (click)="goToSlide(i)">
                  {{item.title}}
                </button>
                }
              </div>
            </div>

            <div class="col-md-9 p-0">
              <carousel (slideChange)="onSlideChange($event)" [responsive]="true" [slideToShow]="1" [slideToScroll]="1"
                [dots]="true" [autoPlay]="true" [displayAutoPlayControls]="true" [infinite]="true" [counter]="false"
                [slideMaxWidth]="99999" [gapBetweenSlides]="0">

                <ng-template #carouselViewContainer #carouselTemplateRef>
                  @for (item of news.carousel; track item.title) {
                  <div class="carousel-slide slide">
                    <div class="slide-content">
                      <h1 class="slide-title">
                        {{item.title}}
                      </h1>
                      <p class="slide-label">
                        {{item.label}}
                      </p>
                      <hr class="slide-divider" />
                      <p class="slide-item">
                        {{item.description}}
                      </p>
                    </div>
                  </div>
                  }
                </ng-template>

              </carousel>
            </div>

          </div>
        </div>

      </div>

      <!-- News Sidebar -->
      <div class="col-md-3 news-col p-0">
        <nav class="news-panel" aria-label="Latest news">

          <h2 class="news-heading">Latest News</h2>
          <div class="news-heading-underline" aria-hidden="true"></div>

          @for (item of news.news; track item.title) {
          <div class="news-item">
            <span class="news-accent-bar" aria-hidden="true"></span>
            <a class="news-link" [href]="item.url" target="_blank" rel="noopener noreferrer">
              {{item.title}}
            </a>
          </div>
          }

        </nav>
      </div>

    </div>
  </div>
</div>
